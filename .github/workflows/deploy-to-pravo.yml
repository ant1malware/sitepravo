name: Build and Push to ant1malware/pravo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (GitHub Pages mode)
        run: npm run build:gh

      - name: Deploy to external repo ant1malware/pravo
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PRAVO_TOKEN }}
          external_repository: ant1malware/pravo
          publish_branch: main
          publish_dir: ./docs
          # Ensure SPA works and no Jekyll processing
          enable_jekyll: false
          commit_message: Deploy: ${{ github.sha }}

